<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Recuperar contraseña | LogicTech Football</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../static/css/main.css" />
  <link rel="stylesheet" href="../static/css/login.css" />
</head>
<body class="login-body">
  <div class="background-animation">
    <div class="football-icon">⚽</div>
    <div class="football-icon">🏆</div>
    <div class="football-icon">🥅</div>
    <div class="football-icon">🎯</div>
    <div class="football-icon">🏅</div>
    <div class="football-icon">⚽</div>
    <div class="football-icon">🏟️</div>
    <div class="football-icon">👟</div>
  </div>

  <div class="login-container only-form">
    <div class="login-form-container wide">
      <div class="login-header">
        <h2 class="login-title">Recuperar contraseña</h2>
        <p class="login-subtitle">Te enviaremos un enlace o código para restablecerla</p>
      </div>

      <form id="recuperar-form">
        <div class="form-group">
          <label class="form-label" for="rec-email">Correo o usuario</label>
          <input id="rec-email" type="text" class="form-control" required />
          <div class="form-error" id="rec-email-error"></div>
        </div>
        <button type="submit" class="btn-login" id="rec-btn">
          <span id="rec-text">Enviar instrucciones</span>
          <span id="rec-spinner" class="d-none"><span class="loading-spinner"></span></span>
        </button>
      </form>

      <div class="login-footer">
        <a href="login.html">← Volver al login</a>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="../static/js/config.js"></script>
  <script src="../static/js/api.js"></script>
  <script src="../static/js/ui.js"></script>
  <script src="../static/js/recuperar.js"></script>
</body>
</html>
