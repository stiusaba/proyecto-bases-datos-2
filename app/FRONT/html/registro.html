<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Registro | LogicTech Football</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../static/css/main.css" />
  <link rel="stylesheet" href="../static/css/login.css" />
</head>
<body class="login-body">
  <div class="background-animation">
    <div class="football-icon">⚽</div>
    <div class="football-icon">🏆</div>
    <div class="football-icon">🥅</div>
    <div class="football-icon">👟</div>
    <div class="football-icon">🎯</div>
    <div class="football-icon">🏅</div>
    <div class="football-icon">⚽</div>
    <div class="football-icon">🏟️</div>
  </div>

  <div class="login-container only-form">
    <div class="login-form-container wide">
      <div class="login-header">
        <h2 class="login-title">Crear cuenta</h2>
        <p class="login-subtitle">Completa los datos para crear tu usuario</p>
      </div>

      <form id="register-form">
        <div class="form-group">
          <label class="form-label" for="reg-nombre">Nombre completo</label>
          <input id="reg-nombre" type="text" class="form-control" required />
          <div class="form-error" id="reg-nombre-error"></div>
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-username">Usuario</label>
          <input id="reg-username" type="text" class="form-control" required />
          <div class="form-error" id="reg-username-error"></div>
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-email">Correo</label>
          <input id="reg-email" type="email" class="form-control" required />
          <div class="form-error" id="reg-email-error"></div>
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-pass">Contraseña</label>
          <div class="password-field">
            <input id="reg-pass" type="password" class="form-control" minlength="6" required />
            <button type="button" class="password-toggle" data-toggle-pass>
              👁️
            </button>
          </div>
          <div class="form-error" id="reg-pass-error"></div>
        </div>
        <div class="form-group">
          <label class="form-label" for="reg-pass2">Repite la contraseña</label>
          <input id="reg-pass2" type="password" class="form-control" minlength="6" required />
          <div class="form-error" id="reg-pass2-error"></div>
        </div>

        <button type="submit" class="btn-login" id="reg-btn">
          <span id="reg-text">Crear cuenta</span>
          <span id="reg-spinner" class="d-none"><span class="loading-spinner"></span></span>
        </button>
      </form>

      <div class="login-footer">
        ¿Ya tienes cuenta?
        <a href="login.html">Inicia sesión</a>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script src="../static/js/config.js"></script>
  <script src="../static/js/api.js"></script>
  <script src="../static/js/ui.js"></script>
  <script src="../static/js/registro.js"></script>
</body>
</html>
